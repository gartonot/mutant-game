<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мутант — арсенал v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111b20;color:#e4e8df;font:15px Arial,sans-serif}main{max-width:1440px;margin:auto;padding:36px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}h1{margin:6px 0;font-size:34px}p{color:#9cafa9;margin:8px 0}small{color:#a6d385;letter-spacing:2px}nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0}select,input,button{accent-color:#a6d385}select,button{background:#26373d;color:#e4e8df;border:1px solid #4b6269;border-radius:6px;padding:9px}a{color:#b5d799}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{border:1px solid #34464c;border-radius:10px;background:linear-gradient(130deg,#23333a,#18262b);overflow:hidden}#grid.matrix{grid-template-columns:repeat(4,minmax(0,1fr))}article.invalid{border-color:#ed7777}#validation{font-variant-numeric:tabular-nums}h2{font-size:15px;margin:16px 18px 0}canvas{display:block;width:100%;height:auto}#status{font-variant-numeric:tabular-nums}@media(max-width:850px){#grid,#grid.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px}header{display:block}}
