<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Мутант — звуковая песочница</title></head>
<body><main>
  <header><div><small>МУТАНТ / ЗВУК</small><h1>Звуковая песочница</h1><p>Выбери оружие, чтобы сразу услышать его выстрел.</p></div><a href="./index.html">Открыть игру →</a></header>
  <div class="layout">
    <section class="weapon-panel" aria-label="Выбор оружия"><h2>Арсенал</h2><div id="weapons"></div></section>
    <section class="preview" aria-label="Прослушивание">
      <small id="sound-kind">ГОТОВО К ПРОВЕРКЕ</small><h2 id="selected-name">Пистолет</h2><p id="sound-description">Запись Walther PPQ</p>
      <div class="sound-mark" aria-hidden="true">❯❯❯</div>
      <button id="play" class="primary">▶ Выстрелить</button>
      <button id="stop">■ Остановить звук</button>
      <label class="volume-label" for="volume">Громкость <output id="volume-value">15%</output></label>
      <input id="volume" type="range" min="0" max="100" value="15">
      <p id="status" role="status" aria-live="polite">Нажми на оружие или «Выстрелить».</p>
      <p class="hint">Звуки и обработка — как в игре. Громкость здесь меняется только для песочницы.</p>
    </section>
  </div>
</main><script type="module" src="/src/dev/sound-sandbox.ts"></script></body>
</html>
